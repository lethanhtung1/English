<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện nghe và viết cùng AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎧%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--accent:#3b6fe0;--ai:#eaf0ff;--me:#e7f6ec;--note:#fff6dd;--line:#e3e0d8;--warm:#fff1c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--text:#f2f2f3;--muted:#9a9aa2;--ai:#1d2740;--me:#1c3125;--note:#3a3320;--line:#2c2c30;--warm:#4a3d12}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--text:#f2f2f3;--muted:#9a9aa2;--ai:#1d2740;--me:#1c3125;--note:#3a3320;--line:#2c2c30;--warm:#4a3d12}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:18px 14px 30px}
h1{font-size:22px;margin:0 0 2px}.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text]{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
input[type=text]{flex:1;min-width:0}
button{padding:9px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
label{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;align-items:start}
@media(max-width:840px){.grid{grid-template-columns:1fr}}
.side{position:sticky;top:12px}
@media(max-width:840px){.side{position:static}}
#chat{min-height:260px;max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.b{padding:10px 12px;border-radius:12px;max-width:88%;word-wrap:break-word}
.ai{background:var(--ai);align-self:flex-start}.me{background:var(--me);align-self:flex-end}
.note{background:var(--note);align-self:stretch;max-width:100%;font-size:14px}
.tools{display:flex;gap:6px;margin-top:6px}.tools button{padding:5px 10px;font-size:13px}
body.hide .ai:not(.show) .txt{display:none}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:auto}
#st{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 8px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab span{opacity:.85;font-weight:400}
#list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);cursor:pointer}
.wc.new{animation:pop .5s ease;background:var(--warm)}
@keyframes pop{from{transform:translateX(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.wt{display:flex;align-items:center;gap:6px}.wt .w{flex:1;font-size:16px}
.wc .m{color:var(--muted);font-size:14px}
.mini{padding:3px 8px;font-size:13px;background:transparent;color:var(--text);border:1px solid var(--line)}
.wc.locked .w,.wc.locked .m,body.test .wc:not(.reveal):not(.locked) .m{filter:blur(6px)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 6px}
.chk{display:block;margin-bottom:4px}
</style>
</head>
<body class="hide">
<main>
<h1>🎧 Luyện nghe và viết</h1>
<p class="sub">AI nói bằng giọng đọc, bạn nghe rồi trả lời bằng cách gõ. AI sửa lỗi cho bạn bằng tiếng Việt.</p>

<div class="card">
  <div class="row">
    <label>Tình huống
      <select id="topic">
        <option>Gọi món ở nhà hàng</option><option>Hỏi đường</option><option>Phỏng vấn xin việc</option>
        <option>Làm quen bạn mới</option><option>Đặt phòng khách sạn</option><option>Mua sắm</option>
      </select>
    </label>
    <label>Trình độ
      <select id="level"><option>Mới bắt đầu (A1-A2)</option><option selected>Trung cấp (B1)</option><option>Khá (B2)</option></select>
    </label>
    <button id="start">▶ Bắt đầu</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label><input type="checkbox" id="hide" checked> Ẩn chữ (luyện nghe)</label>
    <label><input type="checkbox" id="slow"> Đọc chậm</label>
  </div>
  <div id="st"></div>
</div>

<div class="grid">
  <div class="card">
    <div id="chat"><div class="hint">Chọn tình huống rồi bấm “Bắt đầu”.<br>AI sẽ nói trước, bạn lắng nghe và gõ câu trả lời.</div></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="msg" placeholder="Gõ câu trả lời bằng tiếng Anh…" disabled>
      <button id="send" disabled>Gửi</button>
    </div>
  </div>

  <aside class="card side">
    <div class="tabs">
      <button class="tab on" id="tf">🆕 Từ mới <span id="cf">0</span></button>
      <button class="tab" id="ts">⭐ Sổ của tôi <span id="cs">0</span></button>
    </div>
    <label class="chk"><input type="checkbox" id="test"> Tự kiểm tra (ẩn nghĩa, bấm để xem)</label>
    <div class="row" id="add" hidden>
      <input type="text" id="nw" placeholder="Từ / cụm từ">
      <input type="text" id="nm" placeholder="Nghĩa hoặc ghi chú">
      <button id="nadd">+ Thêm</button>
    </div>
    <div id="list"></div>
    <div class="row" id="exp" hidden style="margin-top:8px">
      <button class="ghost" id="dl">⬇ Tải sổ (.csv)</button>
      <button class="ghost" id="clr">🗑 Xóa hết</button>
    </div>
  </aside>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
let hist=[],busy=false,active=false;
const sample={json:async(p)=>{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
  if(!r.ok){let t='';try{t=JSON.stringify(await r.json())}catch(_){}throw new Error(r.status+' '+t)}
  return r.json();
}};

/* ---------- Từ vựng và sổ ghi chú ---------- */
const KEY='lnv_saved';
let saved=[],fresh=[],tab='fresh';
try{saved=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(_){}};
const same=(a,b)=>a.trim().toLowerCase()===b.trim().toLowerCase();
const isSaved=w=>saved.some(x=>same(x.w,w));

function addFresh(list){
  const lock=document.body.classList.contains('hide');
  (list||[]).forEach(x=>{
    if(!x||!x.w||!x.vi||fresh.some(f=>same(f.w,x.w)))return;
    fresh.unshift({w:x.w,vi:x.vi,lock,isNew:true});
  });
  render();
}
function saveWord(item){
  if(isSaved(item.w))return;
  saved.unshift({w:item.w,vi:item.vi});persist();render();
}
function card(item,mode){
  const c=document.createElement('div');
  c.className='wc'+(item.lock?' locked':'')+(item.isNew?' new':'');
  const top=document.createElement('div');top.className='wt';
  const w=document.createElement('strong');w.className='w';w.textContent=item.w;
  const sp=document.createElement('button');sp.className='mini';sp.textContent='🔊';
  sp.onclick=e=>{e.stopPropagation();speak(item.w)};
  top.append(w,sp);
  if(mode==='fresh'){
    const s=document.createElement('button');s.className='mini';
    s.textContent=isSaved(item.w)?'✓ Đã lưu':'⭐ Lưu';s.disabled=isSaved(item.w);
    s.onclick=e=>{e.stopPropagation();saveWord(item)};
    const x=document.createElement('button');x.className='mini';x.textContent='✕';
    x.onclick=e=>{e.stopPropagation();fresh=fresh.filter(f=>f!==item);render()};
    top.append(s,x);
  }else{
    const x=document.createElement('button');x.className='mini';x.textContent='🗑';
    x.onclick=e=>{e.stopPropagation();saved=saved.filter(f=>f!==item);persist();render()};
    top.append(x);
  }
  const m=document.createElement('div');m.className='m';m.textContent=item.vi;
  c.append(top,m);
  c.onclick=()=>{
    if(item.lock){item.lock=false;c.classList.remove('locked')}
    else c.classList.toggle('reveal');
  };
  item.isNew=false;
  return c;
}
function render(){
  $('cf').textContent=fresh.length;$('cs').textContent=saved.length;
  $('tf').classList.toggle('on',tab==='fresh');$('ts').classList.toggle('on',tab==='saved');
  $('add').hidden=tab!=='saved';$('exp').hidden=!(tab==='saved'&&saved.length);
  const list=tab==='fresh'?fresh:saved,box=$('list');box.innerHTML='';
  if(!list.length){
    const e=document.createElement('div');e.className='empty';
    e.textContent=tab==='fresh'?'Từ mới AI gợi ý sẽ được dán vào đây. Bấm ⭐ để lưu vào sổ.':'Sổ còn trống. Lưu từ ở tab “Từ mới” hoặc tự thêm từ phía trên.';
    box.appendChild(e);return;
  }
  list.forEach(it=>box.appendChild(card(it,tab)));
}
$('tf').onclick=()=>{tab='fresh';render()};
$('ts').onclick=()=>{tab='saved';render()};
$('test').onchange=e=>document.body.classList.toggle('test',e.target.checked);
function addManual(){
  const w=$('nw').value.trim(),m=$('nm').value.trim();
  if(!w)return;
  if(!isSaved(w)){saved.unshift({w,vi:m||'(chưa có ghi chú)'});persist()}
  $('nw').value='';$('nm').value='';render();
}
$('nadd').onclick=addManual;
$('nm').onkeydown=e=>{if(e.key==='Enter')addManual()};
$('dl').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv='\uFEFF'+['Từ,Nghĩa'].concat(saved.map(x=>q(x.w)+','+q(x.vi))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='so-tu-vung.csv';a.click();URL.revokeObjectURL(a.href);
};
$('clr').onclick=()=>{if(confirm('Xóa toàn bộ sổ từ vựng?')){saved=[];persist();render()}};

/* ---------- Chat ---------- */
function speak(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=$('slow').checked?0.6:0.9;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
  const v=vs.find(v=>/Google|Natural|Samantha/i.test(v.name))||vs[0];
  if(v)u.voice=v;speechSynthesis.speak(u);
}
function add(cls,text){
  const d=document.createElement('div');d.className='b '+cls;
  const s=document.createElement('span');s.className='txt';s.textContent=text;d.appendChild(s);
  const c=$('chat');if(c.querySelector('.hint'))c.innerHTML='';
  c.appendChild(d);c.scrollTop=c.scrollHeight;return d;
}
function addAI(say,vocab){
  const d=add('ai',say);
  const t=document.createElement('div');t.className='tools';
  const b1=document.createElement('button');b1.className='ghost';b1.textContent='🔊 Nghe lại';b1.onclick=()=>speak(say);
  const b2=document.createElement('button');b2.className='ghost';b2.textContent='👁 Hiện chữ';
  b2.onclick=()=>{d.classList.toggle('show');b2.textContent=d.classList.contains('show')?'🙈 Ẩn chữ':'👁 Hiện chữ'};
  t.append(b1,b2);d.appendChild(t);
  addFresh(vocab);
  speak(say);
}
function addNote(text){
  const d=document.createElement('div');d.className='b note';d.textContent='✏️ '+text;
  $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;
}
function setBusy(b){busy=b;$('send').disabled=b||!active;$('msg').disabled=b||!active;$('start').disabled=b;$('st').textContent=b?'AI đang suy nghĩ…':''}

async function turn(userText){
  setBusy(true);
  const h=hist.map(x=>(x.r==='ai'?'Nhân vật: ':'Học viên: ')+x.t).join('\n')||'(chưa có)';
  const prompt=`Bạn là gia sư tiếng Anh thân thiện, đóng vai nhân vật trong tình huống để học viên người Việt luyện NGHE và VIẾT.
Tình huống: ${$('topic').value}. Trình độ: ${$('level').value}.
Nhân vật nói tiếng Anh ngắn (1-3 câu), từ vựng và độ khó hợp trình độ. Học viên chỉ NGHE (không thấy chữ) rồi gõ trả lời.
Chỉ trả về JSON đúng dạng, không thêm gì khác: {"say":"...","feedback":"...","vocab":[{"w":"...","vi":"..."}]}
- say: lời tiếng Anh nhân vật nói tiếp theo, kết thúc bằng một câu hỏi hoặc yêu cầu để học viên trả lời.
- feedback: tiếng Việt, 1-3 câu: học viên nghe hiểu đúng ý chưa, sửa lỗi ngữ pháp hoặc chính tả, gợi ý cách viết tự nhiên hơn. Lượt mở đầu thì để "".
- vocab: tối đa 2 từ hoặc cụm đáng học trong "say" (w tiếng Anh, vi nghĩa tiếng Việt).
Hội thoại trước đó:
${h}
${userText?'Học viên vừa gõ: '+userText:'Hãy mở đầu hội thoại.'}`;
  try{
    const r=await sample.json(prompt,{cache:false});
    if(r.feedback)addNote(r.feedback);
    hist.push({r:'ai',t:r.say});
    addAI(r.say,r.vocab);
  }catch(e){
    $('st').textContent='Có lỗi: '+((e&&e.message)||'');
    setBusy(false);return;
  }
  setBusy(false);$('msg').focus();
}
$('start').onclick=()=>{hist=[];active=true;$('chat').innerHTML='';turn(null)};
function send(){
  const v=$('msg').value.trim();if(!v||busy)return;
  $('msg').value='';add('me',v);hist.push({r:'me',t:v});turn(v);
}
$('send').onclick=send;
$('msg').onkeydown=e=>{if(e.key==='Enter')send()};
$('hide').onchange=e=>document.body.classList.toggle('hide',e.target.checked);
if('speechSynthesis' in window)speechSynthesis.getVoices();
render();
</script>
</body>
</html>
